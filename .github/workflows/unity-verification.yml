name: Unity verification

# Run on demand because Unity Editor execution and player builds require a private license secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unity-tests:
    name: Unity Edit Mode and Play Mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run all Unity tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        with:
          projectPath: .
          testMode: all
          artifactsPath: artifacts
          coverageEnabled: false
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Edit and Play Mode Tests

      - name: Upload Unity test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-test-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  windows-development-build:
    name: Windows 64-bit Development Build
    needs: unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build Windows player
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        with:
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildName: WHERE THE SOUNDINGS END
          buildsPath: Builds
          buildMethod: WhereTheSoundingsEnd.Editor.ProjectBuildAutomation.BuildWindowsDevelopment

      - name: Upload Windows Development Build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WHERE-THE-SOUNDINGS-END-Windows-Development
          path: Builds/Windows/
          if-no-files-found: error
          retention-days: 14
