name: Project integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate project scaffold and C# syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install C# syntax parser
        run: python -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1

      - name: Validate Unity project files
        run: python tools/validate_project.py

      - name: Validate C# syntax
        run: python tools/validate_csharp.py
